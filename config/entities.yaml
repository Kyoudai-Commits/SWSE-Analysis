# ---------------------------------------------------------------------------
# Canonical entity model.
#
# Maps extracted blocks (config/blocks.yaml) onto canonical entities
# (data/canonical/<entity>.json). Declarative by design: an agent adding a new
# source block should only have to add an entry here.
#
# Per block:
#   id         block id from config/blocks.yaml
#   canon      official | third_party | homebrew (default for its records)
#   fields     "*" = pass every extracted column through; or an explicit
#              {canonical_field: extracted_field} map (unmapped columns dropped)
#   row_hooks  swse.hooks.ROW_HOOKS applied to each raw row (return None to drop)
#   state      values put on ctx.state while this block is processed
#
# Per entity:
#   merge_on   field used to merge records across blocks (default: name)
#   entity_hooks  swse.hooks.ENTITY_HOOKS applied after merging
#   role       what the entity is for, used by swse.space to build the decision
#              space. One of: option | modifier | reference | gear | rule
# ---------------------------------------------------------------------------

post_hooks:
  - derive_talent_trees      # talent rows -> talent_tree records (must precede prereq_pass)
  - skill_class_matrix       # heroic class skill lists -> skill records
  - split_class_grants       # "Feat A Feat B (x)" -> ["Feat A", "Feat B (x)"]
  - audit_class_grants       # verify every parsed grant against the vocabularies
  - attach_urls              # Master Reference Links sheet -> entity urls
  - derive_parameter_axes    # Weapon Proficiency / Skill Focus / ... -> option axes
  - resolve_sourcebooks      # page refs + source tags -> normalised sourcebooks
  - prereq_pass              # structured prerequisites (needs the full entity index)

entities:

  # ============================ character options ==========================
  species:
    label: Species
    role: option
    merge_on: name
    entity_hooks: [species_kind]
    blocks:
      - id: sf_species
        canon: third_party
        row_hooks: [species_cleanup]
        fields: "*"

  racial_ability:
    label: Racial / species ability
    role: modifier
    merge_on: name
    blocks:
      - id: sf_racial_abilities
        canon: third_party
        fields: "*"

  class:
