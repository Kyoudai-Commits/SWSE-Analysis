        canon: third_party
        row_hooks: [drop_section_labels, class_cleanup, tag_to_sourcebooks]
        fields: "*"
      - id: mr_heroic_classes
        canon: official
        row_hooks: [mr_heroic_homebrew_section, mr_class_columns]
