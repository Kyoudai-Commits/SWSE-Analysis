    columns: "B:N"
    rename:
      B: name
      C: class_group
      D: tree
      E: layout_t1
      F: layout_t2
      G: layout_t3
      H: layout_t4
      I: layout_t5
      J: description
      K: available_flag
      L: taken_flag
      M: times_taken
      N: page
    forward_fill: [C, D]
    key_column: B
    canon: third_party
    notes: >-
      One row per talent, ordered tree by tree. C (owning class) and D (talent
      tree) are only written on the first row of their group and are
      forward-filled. E-I repeat the talent name in the column that matches its
      visual tier in the builder; hook `talent_tree_layout` derives
      `tree`, `layout_tier` and fills `name` when B is blank.

