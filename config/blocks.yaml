  - id: sf_species
    entity: species
    source: sagaforge-1.53
    sheet: Data
    header_row: 1
    first_row: 3
    last_row: 133            # 131 species: Data!J3 -> Data!J133 ('Zygerrian')
    # BO and BV are deliberately EXCLUDED: they belong to the alphabetical
    # racial-ability glossary (sf_racial_abilities), which starts on the same
    # row and overlaps this block. Reading them as species fields silently
    # attaches the wrong ability to every species.
    columns: ["J:BN", "BP:BU"]
    rename:
      J: key
      K: source_tag
      L: name
      M: mod_str
      N: mod_dex
      O: mod_con
      P: mod_int
      Q: mod_wis
      R: mod_cha
      S: languages
      T: language_2
      U: language_3
      V: size
      W: age_young_adult
      X: age_adult
      Y: age_middle
      Z: age_old
      AA: age_venerable
      AB: speed
      AN: natural_armor
      AO: ref_bonus
      AP: fort_bonus
      AQ: will_bonus
      AR: damage_reduction
      BP: reroll_skill_1
      BQ: reroll_skill_1_mode
      BR: reroll_skill_2
      BS: reroll_skill_2_mode
      BT: take10_skill_1
      BU: take10_skill_2
    key_column: L
    require_key: true
    canon: third_party
    notes: >-
      The single richest block in the corpus: ability mods, size, age brackets,
      speed, up to 5 named specials, skill focus/training grants, defense
      bonuses, granted feats (including conditional grants), exotic weapon
      familiarity, natural weapons with damage and type, and structured
      skill-reroll / take-10 grants. The names in `special_1..special_5` are
      keys into the sf_racial_abilities glossary, which supplies their text.

