# ---------------------------------------------------------------------------
# Extraction map: every logical table ("block") inside the source workbooks.
#
# Each block becomes data/raw/<id>.jsonl with one JSON object per row.
# Field names come from `rename` (by column letter) > `rename_header` (by header
# text) > the slugified header text.
#
# Conventions
#   id        <source-prefix>_<thing>   e.g. sf_ = SagaForge, mr_ = Master Reference
#   entity    the canonical entity this block feeds (see config/entities.yaml)
#   canon     official | third_party | homebrew  (per-record default)
#   forward_fill  carry a value down through blank cells (tree/section grouping)
#   last_row  pin the extent explicitly when the workbook's own defined name gives it
#
# How to add a block: run `python -m swse.cli discover --sheet Data` to see the
# header/column census for a sheet, then add an entry here and re-run `make raw`.
# ---------------------------------------------------------------------------

blocks:

