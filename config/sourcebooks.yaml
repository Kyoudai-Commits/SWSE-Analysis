# ---------------------------------------------------------------------------
# Sourcebook abbreviation registry.
#
# The corpus records provenance in two incompatible dialects:
#   * SagaForge page refs   -> `page` fields, e.g. "JATM 14", "GoI 24", "207"
#   * SagaForge source tags -> `source_tag` fields, e.g. ",SECR,", "UR", "CWCS, LECG"
#   * Master Reference      -> wiki URLs only
#
# This file is the single place that maps every abbreviation onto a sourcebook,
# so `canon` can emit a normalised `sourcebooks: [ {id, abbreviation, page} ]`
# on every record. Add new abbreviations here, never in code.
#
# Legend source: SagaForge `Lists`!EA2:EA15 and `Lists`!EB2:EC15, plus
# SagaForge `Data`!IA3:IB12 ("Supplements"). Entries marked
# `attested_by: inferred` were found in the data but not in SagaForge's own
# legend; their titles are inferred from the abbreviation and need review.
# ---------------------------------------------------------------------------

sourcebooks:
  - id: secr
    abbreviation: SECR
    aliases: [CR, SECRLECG]
    title: "Star Wars Roleplaying Game Saga Edition Core Rulebook"
    short_title: "Core Rulebook"
    publisher: "Wizards of the Coast"
    year: 2007
    canon: official
    notes: "Bare numeric page refs (e.g. '207', '39') are Core Rulebook pages."

